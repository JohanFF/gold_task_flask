<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Tarea - Gold Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="main-header">
    <a href="/dashboard" class="brand">
        <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="Logo" class="logo-img">
        <h2 style="margin:0; color:#d4af37;">Gold Task</h2>
    </a>
    <nav class="nav-links">
        <a href="/dashboard">Mi Panel</a>
        <a href="/logout" style="color:#e74c3c;">Salir</a>
    </nav>
</header>

<div class="flex-wrapper">
    <div class="container" style="width:450px;">
        <h1>Editar Tarea</h1>
        <form action="/tareas/editar/{{ tarea.id }}" method="POST">
            <label>Título de la tarea:</label>
            <input type="text" name="titulo" value="{{ tarea.titulo }}" minlength="5" required>
            
            <label>Categoría:</label>
            <select name="categoria_id" required>
                <option value="">-- Selecciona una categoría --</option>
                {% for cat in categorias %}
                    <option value="{{ cat.id }}" {% if cat.id == tarea.categoria_id %}selected{% endif %}>
                        {{ cat.nombre }}
                    </option>
                {% endfor %}
            </select>
            
            <label>Fecha de vencimiento:</label>
            <input type="date" name="fecha_vencimiento" value="{{ tarea.fecha_vencimiento }}" required>
            
            <label>Hora (opcional):</label>
            <input type="time" name="hora" value="{{ tarea.hora or '' }}">
            
            <label>Ubicación (opcional):</label>
            <input type="text" name="ubicacion" value="{{ tarea.ubicacion or '' }}">
            
            <label>Observaciones (opcional, máximo 250 caracteres):</label>
            <textarea name="observaciones" maxlength="250" style="width:100%; padding:10px; background:#2c2c2c; color:white; border:1px solid #333; border-radius:6px; margin-bottom:20px; resize:vertical;">{{ tarea.observaciones or '' }}</textarea>
            
            <label>Prioridad:</label>
            <select name="prioridad">
                <option value="1" {% if tarea.prioridad == 1 %}selected{% endif %}>Baja</option>
                <option value="2" {% if tarea.prioridad == 2 %}selected{% endif %}>Media</option>
                <option value="3" {% if tarea.prioridad == 3 %}selected{% endif %}>Alta</option>
            </select>
            
            <button type="submit">Guardar Cambios</button>
        </form>
        <p style="text-align:center; margin-top:15px;">
            <a href="/dashboard" style="color:#aaa; text-decoration:none;">← Cancelar</a>
        </p>
    </div>
</div>
</body>
</html>
